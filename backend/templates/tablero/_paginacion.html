{% if is_paginated %}
<nav class="paginacion" aria-label="Paginación">
  <span>Página {{ page_obj.number }} de {{ page_obj.paginator.num_pages }}</span>
  <div class="paginacion-botones">
    {% if page_obj.has_previous %}<a class="btn btn-secundario btn-chico" href="?{% if parametros %}{{ parametros }}&amp;{% endif %}page={{ page_obj.previous_page_number }}">Anterior</a>{% endif %}
    {% if page_obj.has_next %}<a class="btn btn-secundario btn-chico" href="?{% if parametros %}{{ parametros }}&amp;{% endif %}page={{ page_obj.next_page_number }}">Siguiente</a>{% endif %}
  </div>
</nav>
{% endif %}

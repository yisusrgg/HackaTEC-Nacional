<div class="campo-grupo{% if campo.errors %} con-error{% endif %}">
  <label for="{{ campo.id_for_label }}">{{ campo.label }}</label>
  {{ campo }}
  {% if campo.errors %}<p class="campo-error">{{ campo.errors|join:" " }}</p>{% elif campo.help_text %}<p class="campo-ayuda">{{ campo.help_text }}</p>{% endif %}
</div>

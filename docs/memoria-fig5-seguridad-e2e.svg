<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1950 1110" width="1950" height="1110" font-family="'Noto Sans','Segoe UI',Arial,sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4.4" markerHeight="4.4" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#546E7A"/>
    </marker>
    <marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4.4" markerHeight="4.4" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#E65100"/>
    </marker>
  </defs>
  <style>
    .t { font-size: 29px; font-weight: 700; fill: #263238; text-anchor: middle; }
    .l { font-size: 22px; fill: #455A64; text-anchor: middle; }
    .n { font-size: 19px; fill: #78909C; font-style: italic; text-anchor: middle; }
    .m { font-family: Consolas,'Courier New',monospace; font-size: 24px; font-weight: 700; fill: #263238; text-anchor: middle; }
    .num { font-size: 24px; font-weight: 700; fill: #ffffff; text-anchor: middle; }
    .lab { font-size: 19px; font-weight: 700; fill: #546E7A; text-anchor: middle; }
    .ph { font-size: 27px; font-weight: 700; fill: #546E7A; }
    .verde { fill: #E8F5E9; stroke: #2E7D32; stroke-width: 5; }
    .azul { fill: #E3F2FD; stroke: #1565C0; stroke-width: 5; }
    .naranja { fill: #FFF3E0; stroke: #E65100; stroke-width: 5; }
    .panel { fill: #FAFAFA; stroke: #B0BEC5; stroke-width: 3; stroke-dasharray: 12 9; }
    .hex { font-family: Consolas,'Courier New',monospace; font-size: 30px; font-weight: 700; text-anchor: middle; }
    .idx { font-size: 17px; fill: #78909C; text-anchor: middle; }
    .gl { font-size: 22px; font-weight: 700; text-anchor: middle; }
    .gs { font-size: 20px; fill: #546E7A; text-anchor: middle; }
    .nota { font-size: 21px; fill: #455A64; }
    .v1 { font-size: 22px; fill: #263238; font-weight: 700; }
    .v2 { font-size: 22px; fill: #455A64; }
  </style>

  <rect width="1950" height="1110" fill="#ffffff"/>
  <text x="36" y="60" font-size="42" font-weight="700" fill="#1A3A5C">Protección extremo a extremo de una lectura</text>
  <text x="36" y="100" font-size="24" fill="#607D8B">Ejemplo del vector de prueba: nodo 1, 23.4 °C y 55.0 %HR. Solo el nodo y el servidor conocen la clave.</text>

  <!-- ===== Etapa 1: nodo ===== -->
  <rect class="verde" x="40" y="140" width="410" height="420" rx="18"/>
  <circle cx="82" cy="186" r="22" fill="#2E7D32"/><text class="num" x="82" y="195">1</text>
  <text class="t" x="260" y="196">Nodo ESP32 #1</text>
  <text class="l" x="245" y="248">lectura: 23.4 °C y 55.0 %HR</text>
  <rect x="100" y="266" width="290" height="50" rx="10" fill="#ffffff" stroke="#2E7D32" stroke-width="2.5"/>
  <text class="m" x="245" y="300">00 EA 02 26</text>
  <text class="l" x="245" y="360">cifra con AES-128 (K_enc)</text>
  <text class="l" x="245" y="400">suma el contador de 32 bits</text>
  <text class="l" x="245" y="440">autentica con HMAC (K_mac)</text>
  <text class="n" x="245" y="520">clave única de 32 bytes por nodo</text>

  <line x1="452" y1="350" x2="524" y2="350" stroke="#546E7A" stroke-width="5" marker-end="url(#a)"/>
  <text class="lab" x="490" y="334">CAN</text>

  <!-- ===== Etapa 2: bus CAN ===== -->
  <rect class="azul" x="530" y="140" width="410" height="420" rx="18"/>
  <circle cx="572" cy="186" r="22" fill="#1565C0"/><text class="num" x="572" y="195">2</text>
  <text class="t" x="750" y="196">Bus CAN propio</text>
  <text class="l" x="735" y="248">ID 0x110 · 8 bytes</text>
  <rect x="560" y="266" width="350" height="50" rx="10" fill="#ffffff" stroke="#1565C0" stroke-width="2.5"/>
  <text class="m" x="735" y="300">D9 8F 7B EA 00 01 F8 FC</text>
  <text class="l" x="735" y="360">un intruso en el bus solo ve</text>
  <text class="l" x="735" y="400">datos cifrados y no puede</text>
  <text class="l" x="735" y="440">crear tramas válidas</text>
  <text class="n" x="735" y="520">aislado del CAN del autobús</text>

  <line x1="942" y1="350" x2="1014" y2="350" stroke="#546E7A" stroke-width="5" marker-end="url(#a)"/>
  <text class="lab" x="980" y="334">RX</text>

  <!-- ===== Etapa 3: gateway ===== -->
  <rect class="azul" x="1020" y="140" width="410" height="420" rx="18"/>
  <circle cx="1062" cy="186" r="22" fill="#1565C0"/><text class="num" x="1062" y="195">3</text>
  <text class="t" x="1240" y="196">Gateway ESP32 #2</text>
  <text class="l" x="1225" y="248">reenvía la trama sin abrirla</text>
  <rect x="1045" y="266" width="360" height="50" rx="10" fill="#ffffff" stroke="#1565C0" stroke-width="2.5"/>
  <text class="m" x="1225" y="299" font-size="20">{"gw":"GW-01","lote":42}</text>
  <text class="l" x="1225" y="360">lote con número único</text>
  <text class="l" x="1225" y="400">firma: HMAC-SHA256 del lote</text>
  <text class="l" x="1225" y="440">HTTPS verificando la CA propia</text>
  <text class="n" x="1225" y="520">cola en flash si no hay red</text>

  <line x1="1432" y1="350" x2="1504" y2="350" stroke="#E65100" stroke-width="5" marker-end="url(#ao)"/>
  <text class="lab" x="1470" y="334" fill="#E65100" style="fill:#E65100">HTTPS</text>

  <!-- ===== Etapa 4: servidor ===== -->
  <rect class="naranja" x="1510" y="140" width="410" height="420" rx="18"/>
  <circle cx="1552" cy="186" r="22" fill="#E65100"/><text class="num" x="1552" y="195">4</text>
  <text class="t" x="1730" y="196">Servidor Django</text>
  <text class="l" x="1715" y="250">verifica firma y n.º de lote</text>
  <text class="l" x="1715" y="295">reconstruye el contador</text>
  <text class="l" x="1715" y="340">verifica el MAC de la trama</text>
  <text class="l" x="1715" y="385">descifra: 23.4 °C y 55.0 %HR</text>
  <text class="l" x="1715" y="430">guarda y evalúa alertas</text>
  <text class="n" x="1715" y="520">claves cifradas en reposo (Fernet)</text>

  <line x1="1715" y1="562" x2="1715" y2="612" stroke="#546E7A" stroke-width="5" marker-end="url(#a)"/>

  <!-- ===== Panel: formato de la trama ===== -->
  <rect class="panel" x="40" y="615" width="1010" height="430" rx="22"/>
  <text class="ph" x="70" y="660">Formato de la trama segura (8 bytes)</text>

  <g>
    <text class="idx" x="133" y="700">byte 0</text><text class="idx" x="245" y="700">1</text>
    <text class="idx" x="357" y="700">2</text><text class="idx" x="469" y="700">3</text>
    <text class="idx" x="581" y="700">4</text><text class="idx" x="693" y="700">5</text>
    <text class="idx" x="805" y="700">6</text><text class="idx" x="917" y="700">7</text>

    <rect x="80" y="712" width="106" height="84" rx="8" fill="#E3F2FD" stroke="#1565C0" stroke-width="3"/>
    <rect x="192" y="712" width="106" height="84" rx="8" fill="#E3F2FD" stroke="#1565C0" stroke-width="3"/>
    <rect x="304" y="712" width="106" height="84" rx="8" fill="#E3F2FD" stroke="#1565C0" stroke-width="3"/>
    <rect x="416" y="712" width="106" height="84" rx="8" fill="#E3F2FD" stroke="#1565C0" stroke-width="3"/>
    <rect x="528" y="712" width="106" height="84" rx="8" fill="#E8F5E9" stroke="#2E7D32" stroke-width="3"/>
    <rect x="640" y="712" width="106" height="84" rx="8" fill="#E8F5E9" stroke="#2E7D32" stroke-width="3"/>
    <rect x="752" y="712" width="106" height="84" rx="8" fill="#FFF3E0" stroke="#E65100" stroke-width="3"/>
    <rect x="864" y="712" width="106" height="84" rx="8" fill="#FFF3E0" stroke="#E65100" stroke-width="3"/>

    <text class="hex" x="133" y="765" fill="#1565C0">D9</text><text class="hex" x="245" y="765" fill="#1565C0">8F</text>
    <text class="hex" x="357" y="765" fill="#1565C0">7B</text><text class="hex" x="469" y="765" fill="#1565C0">EA</text>
    <text class="hex" x="581" y="765" fill="#2E7D32">00</text><text class="hex" x="693" y="765" fill="#2E7D32">01</text>
    <text class="hex" x="805" y="765" fill="#E65100">F8</text><text class="hex" x="917" y="765" fill="#E65100">FC</text>

    <path d="M84 812 v12 h434 v-12" fill="none" stroke="#1565C0" stroke-width="3"/>
    <path d="M532 812 v12 h210 v-12" fill="none" stroke="#2E7D32" stroke-width="3"/>
    <path d="M756 812 v12 h210 v-12" fill="none" stroke="#E65100" stroke-width="3"/>
    <text class="gl" x="301" y="860" fill="#1565C0">datos cifrados</text>
    <text class="gs" x="301" y="888">AES-128 en modo flujo</text>
    <text class="gl" x="637" y="860" fill="#2E7D32">contador</text>
    <text class="gs" x="637" y="888">16 bits bajos</text>
    <text class="gl" x="861" y="860" fill="#E65100">MAC truncado</text>
    <text class="gs" x="861" y="888">HMAC-SHA256</text>
  </g>

  <text class="nota" x="70" y="955">• El MAC cubre ID, contador y datos cifrados: un solo bit cambiado invalida la trama.</text>
  <text class="nota" x="70" y="995">• El par (ID, contador) nunca se repite, por lo que el cifrado nunca se reutiliza.</text>

  <!-- ===== Panel: veredicto ===== -->
  <rect class="panel" x="1090" y="615" width="830" height="430" rx="22"/>
  <text class="ph" x="1120" y="660">Veredicto del servidor para cada trama</text>

  <rect x="1115" y="690" width="780" height="100" rx="14" fill="#ffffff" stroke="#CFD8DC" stroke-width="2"/>
  <rect x="1135" y="712" width="220" height="56" rx="28" fill="#2E7D32"/>
  <text x="1245" y="748" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle">ACEPTADA</text>
  <text class="v1" x="1380" y="732">MAC válido y contador nuevo</text>
  <text class="v2" x="1380" y="766">se descifra y se guarda la lectura</text>

  <rect x="1115" y="805" width="780" height="100" rx="14" fill="#ffffff" stroke="#CFD8DC" stroke-width="2"/>
  <rect x="1135" y="827" width="220" height="56" rx="28" fill="#EF6C00"/>
  <text x="1245" y="863" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle">REPETICIÓN</text>
  <text class="v1" x="1380" y="847">MAC válido con un contador viejo</text>
  <text class="v2" x="1380" y="881">se rechaza y abre alerta de seguridad</text>

  <rect x="1115" y="920" width="780" height="100" rx="14" fill="#ffffff" stroke="#CFD8DC" stroke-width="2"/>
  <rect x="1135" y="942" width="220" height="56" rx="28" fill="#C62828"/>
  <text x="1245" y="978" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle">INVÁLIDA</text>
  <text class="v1" x="1380" y="962">MAC incorrecto: alterada o falsa</text>
  <text class="v2" x="1380" y="996">se rechaza; 5 en 60 s abren alerta</text>

  <text x="975" y="1085" font-size="23" fill="#455A64" text-anchor="middle">Cada rechazo queda en la <tspan font-weight="700" fill="#263238">bitácora de auditoría encadenada con SHA-256</tspan>, visible solo para el rol Administrador.</text>
</svg>

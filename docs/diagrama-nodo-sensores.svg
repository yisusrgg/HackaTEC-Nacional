  <text class="h3" x="1470" y="494" text-anchor="middle">Bus CAN propio</text>
  <text class="s" x="1470" y="513" text-anchor="middle">250 kbit/s · par trenzado</text>
  <text class="t" x="1470" y="534" text-anchor="middle">→ Gateway</text>
  <text class="s" x="1470" y="553" text-anchor="middle">(ESP32 #2)</text>

  <!-- Detalle de divisores -->
  <rect class="panel" x="60" y="790" width="330" height="180" rx="10"/>

  <text class="p" x="1070" y="506">CTX</text>
  <text class="p" x="1070" y="540">CRX</text>
  <text class="p" x="1350" y="506" text-anchor="end">CANH</text>
  <text class="p" x="1350" y="540" text-anchor="end">CANL</text>

  <rect class="caja" x="1060" y="556" width="300" height="28" rx="6"/>

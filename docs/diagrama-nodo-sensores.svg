    .punto { fill: #334155; }
    .pd { fill: #fbbf24; stroke: #92400e; stroke-width: 1; }
    .b33 { fill: #ffedd5; } .b5 { fill: #fee2e2; } .bvin { fill: #ede9fe; }
    .tb33 { fill: #9a3412; font-size: 10.5px; font-weight: 700; }
    .tb5 { fill: #991b1b; font-size: 10.5px; font-weight: 700; }
    .tbvin { fill: #5b21b6; font-size: 10.5px; font-weight: 700; }
    .h1 { font-size: 24px; font-weight: 700; fill: #0f172a; }
    .h2 { font-size: 14px; fill: #475569; }
    .h3 { font-size: 13px; font-weight: 700; fill: #0f172a; }

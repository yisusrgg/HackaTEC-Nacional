  <text class="h3" x="436" y="816">Fotorresistencia de la zona 1</text>
  <text class="p" x="440" y="872">3.3 V</text>
  <line class="esq" x1="484" y1="868" x2="540" y2="868"/>
  <rect class="res" x="540" y="860" width="56" height="16" rx="2"/>
  <text class="s" x="568" y="853" text-anchor="middle">LDR</text>
  <line class="esq" x1="596" y1="868" x2="670" y2="868"/>
  <circle class="punto" cx="635" cy="868" r="3.5"/>
  <text class="p" x="676" y="872">VP · 36</text>
  <line class="esq" x1="635" y1="868" x2="635" y2="888"/>

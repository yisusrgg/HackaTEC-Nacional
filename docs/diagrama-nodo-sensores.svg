  <text class="s" x="74" y="398">VCC desde GPIO32 · solo al medir</text>
  <text class="p" x="382" y="370" text-anchor="end">AO</text>
  <text class="p" x="382" y="404" text-anchor="end">VCC</text>

  <rect class="caja" x="60" y="454" width="330" height="62" rx="6"/>
  <text class="t" x="74" y="480">Ultrasónico HC-SR04 · nivel del tanque</text>
  <text class="s" x="74" y="500">Alimentación 5 V (pin VIN)</text>
  <text class="p" x="382" y="472" text-anchor="end">ECHO</text>
  <text class="p" x="382" y="506" text-anchor="end">TRIG</text>

  <rect class="caja" x="60" y="522" width="330" height="28" rx="6"/>
  <text class="t" x="74" y="540">HW-201 · RPM del ventilador (A/C)</text>
  <rect class="b33" x="330" y="527" width="50" height="18" rx="9"/><text class="tb33" x="355" y="540" text-anchor="middle">3.3 V</text>

  <rect class="caja" x="60" y="556" width="330" height="28" rx="6"/>
  <text class="t" x="74" y="574">PIR HC-SR501 · presencia</text>
  <rect class="b5" x="330" y="561" width="50" height="18" rx="9"/><text class="tb5" x="355" y="574" text-anchor="middle">5 V</text>

  <rect class="caja" x="60" y="624" width="330" height="28" rx="6"/>
  <text class="t" x="74" y="642">Módulo LDR digital (DO) · zona 3</text>
  <rect class="b33" x="330" y="629" width="50" height="18" rx="9"/><text class="tb33" x="355" y="642" text-anchor="middle">3.3 V</text>

  <!-- Sensores y transceptor del lado derecho -->
  <rect class="caja" x="1060" y="250" width="300" height="130" rx="6"/>

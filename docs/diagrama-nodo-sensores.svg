  <rect width="1560" height="1000" fill="#ffffff"/>

  <!-- Título y leyenda -->
  <text class="h1" x="60" y="58">Nodo 1 · ESP32 de sensores — diagrama de conexiones</text>
  <text class="h2" x="60" y="86">ESP32 DevKit V1 (30 pines) sobre placa de expansión · fila V en 3.3 V · todas las tierras unidas</text>

  <line class="cable ac" x1="820" y1="96" x2="844" y2="96"/><text class="s" x="850" y="100">Aire acond.</text>
  <line class="cable san" x1="960" y1="96" x2="984" y2="96"/><text class="s" x="990" y="100">Sanitario</text>
  <line class="cable luz" x1="1080" y1="96" x2="1104" y2="96"/><text class="s" x="1110" y="100">Iluminación</text>
  <line class="cable elec" x1="1210" y1="96" x2="1234" y2="96"/><text class="s" x="1240" y="100">Eléctrico</text>
  <line class="cable datos" x1="1320" y1="96" x2="1344" y2="96"/><text class="s" x="1350" y="100">Señal TX/RX del CAN</text>

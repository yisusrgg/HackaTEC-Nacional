  <rect class="caja" x="60" y="284" width="330" height="28" rx="6"/>
  <text class="t" x="74" y="302">Módulo LDR analógico (AO) · zona 2</text>
  <rect class="b33" x="330" y="289" width="50" height="18" rx="9"/><text class="tb33" x="355" y="302" text-anchor="middle">3.3 V</text>

  <rect class="caja" x="60" y="318" width="330" height="28" rx="6"/>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1560 1000" width="1560" height="1000" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title>Nodo 1 · ESP32 de sensores — diagrama de conexiones</title>

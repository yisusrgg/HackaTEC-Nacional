  <text class="s" x="650" y="912">10 kΩ</text>
  <line class="esq" x1="635" y1="928" x2="635" y2="942"/>
  <line class="esq" x1="621" y1="942" x2="649" y2="942"/><line class="esq" x1="626" y1="948" x2="644" y2="948"/><line class="esq" x1="631" y1="954" x2="639" y2="954"/>
  <text class="s" x="656" y="952">GND</text>

  <rect class="panel" x="780" y="790" width="330" height="180" rx="10"/>
  <text class="h3" x="796" y="816">Medición de voltaje (hasta ~12 V)</text>
  <text class="p" x="800" y="872">VIN</text>
  <line class="esq" x1="844" y1="868" x2="900" y2="868"/>
  <rect class="res" x="900" y="860" width="56" height="16" rx="2"/>
  <text class="s" x="928" y="853" text-anchor="middle">100 kΩ</text>
  <line class="esq" x1="956" y1="868" x2="1030" y2="868"/>
  <circle class="punto" cx="995" cy="868" r="3.5"/>
  <text class="p" x="1036" y="872">GPIO34</text>
  <line class="esq" x1="995" y1="868" x2="995" y2="888"/>
  <rect class="res" x="987" y="888" width="16" height="40" rx="2"/>
  <text class="s" x="1010" y="912">33 kΩ</text>
  <line class="esq" x1="995" y1="928" x2="995" y2="942"/>
  <line class="esq" x1="981" y1="942" x2="1009" y2="942"/><line class="esq" x1="986" y1="948" x2="1004" y2="948"/><line class="esq" x1="991" y1="954" x2="999" y2="954"/>
  <text class="s" x="1016" y="952">GND</text>

  <rect class="panel" x="1140" y="790" width="380" height="180" rx="10"/>
  <text class="h3" x="1156" y="816">Antes de energizar</text>
  <text class="s" x="1158" y="842">• Jumper de la fila V de la placa en 3.3 V</text>
  <text class="s" x="1158" y="862">• HC-SR04 y PIR a 5 V (pin VIN)</text>
  <text class="s" x="1158" y="882">• Nada conectado a GPIO12 (impide el arranque)</text>
  <text class="s" x="1158" y="902">• Analógicos solo en GPIO32–39 (ADC1)</text>
  <text class="s" x="1158" y="922">• Alimenta por USB o con 7–9 V, no con 12 V</text>
  <text class="s" x="1158" y="942">• Entre CANH y CANL deben medirse ≈ 60 Ω (apagado)</text>
</svg>

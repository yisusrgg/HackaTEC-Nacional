  <text class="p" x="1070" y="268">SCL</text>
  <text class="p" x="1070" y="370">SDA</text>

  <rect class="caja" x="1060" y="488" width="300" height="62" rx="6"/>
  <text class="t" x="1210" y="513" text-anchor="middle">Transceptor CAN SN65HVD230</text>

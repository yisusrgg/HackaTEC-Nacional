  <!-- Notas junto a los pines sin cable -->
  <text class="gris" x="588" y="234" text-anchor="end">reset</text>
  <text class="gris" x="588" y="438" text-anchor="end">libre</text>
  <text class="rojo" x="588" y="608" text-anchor="end">NO USAR · pin de arranque</text>
  <text class="t" x="420" y="676" text-anchor="end">GND → tierra de todos los sensores</text>
  <text class="t" x="420" y="710" text-anchor="end">5 V → VCC del HC-SR04 y del PIR</text>
  <text class="gris" x="912" y="234">libre</text>
  <text class="gris" x="912" y="302">USB serie · no usar</text>
  <text class="gris" x="912" y="336">USB serie · no usar</text>
  <text class="gris" x="912" y="404">libre</text>

  <line class="esq" x1="261" y1="942" x2="289" y2="942"/><line class="esq" x1="266" y1="948" x2="284" y2="948"/><line class="esq" x1="271" y1="954" x2="279" y2="954"/>
  <text class="s" x="296" y="952">GND</text>


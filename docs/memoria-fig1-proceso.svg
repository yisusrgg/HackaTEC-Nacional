<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 1060" width="1800" height="1060" font-family="'Noto Sans','Segoe UI',Arial,sans-serif">
  <defs>
    <marker id="fl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#546E7A"/>
    </marker>
    <marker id="fo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#E65100"/>
    </marker>
  </defs>
  <rect width="1800" height="1060" fill="#ffffff"/>

  <text x="90" y="72" font-size="46" font-weight="700" fill="#1B5E20">Proceso de desarrollo del sistema</text>
  <text x="90" y="118" font-size="27" fill="#607D8B">Seis etapas iterativas: cada una se verifica antes de pasar a la siguiente</text>

  <!-- ===== Fila 1: etapas 1 → 2 → 3 ===== -->
  <g>
    <rect x="130" y="190" width="440" height="290" rx="22" fill="#E8F5E9" stroke="#2E7D32" stroke-width="5"/>
    <circle cx="134" cy="194" r="32" fill="#2E7D32"/>
    <text x="134" y="206" font-size="34" font-weight="700" fill="#fff" text-anchor="middle">1</text>
    <text x="350" y="302" font-size="42" font-weight="700" fill="#263238" text-anchor="middle">Requisitos</text>
    <g font-size="27" fill="#455A64" text-anchor="middle">
      <text x="350" y="348">El reto de Volvo se desglosó</text>
      <text x="350" y="382">en requisitos funcionales</text>
      <text x="350" y="416">y controles de seguridad</text>
    </g>
  </g>
  <g>
    <rect x="670" y="190" width="440" height="290" rx="22" fill="#E8F5E9" stroke="#2E7D32" stroke-width="5"/>
    <circle cx="674" cy="194" r="32" fill="#2E7D32"/>
    <text x="674" y="206" font-size="34" font-weight="700" fill="#fff" text-anchor="middle">2</text>
    <text x="890" y="302" font-size="42" font-weight="700" fill="#263238" text-anchor="middle">Arquitectura</text>
    <g font-size="27" fill="#455A64" text-anchor="middle">
      <text x="890" y="348">Cuatro capas independientes:</text>
      <text x="890" y="382">sensores, nodo, gateway y</text>
      <text x="890" y="416">servidor. Bus CAN propio,</text>
      <text x="890" y="450">sin conexión al del vehículo</text>
    </g>
  </g>
  <g>
    <rect x="1210" y="190" width="440" height="290" rx="22" fill="#E8F5E9" stroke="#2E7D32" stroke-width="5"/>
    <circle cx="1214" cy="194" r="32" fill="#2E7D32"/>
    <text x="1214" y="206" font-size="34" font-weight="700" fill="#fff" text-anchor="middle">3</text>
    <text x="1430" y="302" font-size="42" font-weight="700" fill="#263238" text-anchor="middle">Amenazas</text>
    <g font-size="27" fill="#455A64" text-anchor="middle">
      <text x="1430" y="348">Se identificaron ataques</text>
      <text x="1430" y="382">de alteración, repetición</text>
      <text x="1430" y="416">y suplantación, y se asignó</text>
      <text x="1430" y="450">un control a cada uno</text>
    </g>
  </g>

  <!-- flechas fila 1 -->
  <line x1="580" y1="335" x2="662" y2="335" stroke="#546E7A" stroke-width="6" marker-end="url(#fl)"/>
  <line x1="1120" y1="335" x2="1202" y2="335" stroke="#546E7A" stroke-width="6" marker-end="url(#fl)"/>
  <!-- baja de 3 a 4 -->
  <line x1="1430" y1="490" x2="1430" y2="592" stroke="#546E7A" stroke-width="6" marker-end="url(#fl)"/>

  <!-- ===== Fila 2: etapas 4 → 5 → 6 (de derecha a izquierda) ===== -->
  <g>
    <rect x="1210" y="600" width="440" height="290" rx="22" fill="#E3F2FD" stroke="#1565C0" stroke-width="5"/>
    <circle cx="1214" cy="604" r="32" fill="#1565C0"/>
    <text x="1214" y="616" font-size="34" font-weight="700" fill="#fff" text-anchor="middle">4</text>
    <text x="1430" y="712" font-size="42" font-weight="700" fill="#263238" text-anchor="middle">Desarrollo</text>
    <g font-size="27" fill="#455A64" text-anchor="middle">
      <text x="1430" y="758">Protocolo con un vector de</text>
      <text x="1430" y="792">prueba común para firmware</text>
      <text x="1430" y="826">y servidor; después, backend,</text>
      <text x="1430" y="860">firmware y tablero</text>
    </g>
  </g>
  <g>
    <rect x="670" y="600" width="440" height="290" rx="22" fill="#FFF3E0" stroke="#E65100" stroke-width="5"/>
    <circle cx="674" cy="604" r="32" fill="#E65100"/>
    <text x="674" y="616" font-size="34" font-weight="700" fill="#fff" text-anchor="middle">5</text>
    <text x="890" y="712" font-size="42" font-weight="700" fill="#263238" text-anchor="middle">Verificación</text>
    <g font-size="27" fill="#455A64" text-anchor="middle">
      <text x="890" y="758">Pruebas automatizadas del</text>
      <text x="890" y="792">backend, simulador de</text>
      <text x="890" y="826">datos y pruebas en banco</text>
      <text x="890" y="860">con sensores reales</text>
    </g>
  </g>
  <g>
    <rect x="130" y="600" width="440" height="290" rx="22" fill="#FFF3E0" stroke="#E65100" stroke-width="5"/>
    <circle cx="134" cy="604" r="32" fill="#E65100"/>
    <text x="134" y="616" font-size="34" font-weight="700" fill="#fff" text-anchor="middle">6</text>
    <text x="350" y="712" font-size="42" font-weight="700" fill="#263238" text-anchor="middle">Validación</text>
    <g font-size="27" fill="#455A64" text-anchor="middle">
      <text x="350" y="758">Demostración de extremo a</text>
      <text x="350" y="792">extremo con una trama</text>
      <text x="350" y="826">alterada, una repetida y</text>
      <text x="350" y="860">un corte de red</text>
    </g>
  </g>

  <!-- flechas fila 2 (hacia la izquierda) -->
  <line x1="1200" y1="745" x2="1118" y2="745" stroke="#546E7A" stroke-width="6" marker-end="url(#fl)"/>
  <line x1="660" y1="745" x2="578" y2="745" stroke="#546E7A" stroke-width="6" marker-end="url(#fl)"/>

  <!-- ciclo de iteración: de la 6 a la 1 -->
  <path d="M124 745 H70 V335 H122" fill="none" stroke="#E65100" stroke-width="6" stroke-linejoin="round" marker-end="url(#fo)"/>
  <text transform="translate(38,540) rotate(-90)" font-size="28" font-weight="700" fill="#E65100" text-anchor="middle">Iteración</text>

  <!-- leyenda -->
  <rect x="130" y="940" width="30" height="30" rx="7" fill="#E8F5E9" stroke="#2E7D32" stroke-width="4"/>
  <text x="174" y="964" font-size="26" fill="#455A64">Diseño (etapas 1 a 3)</text>
  <rect x="560" y="940" width="30" height="30" rx="7" fill="#E3F2FD" stroke="#1565C0" stroke-width="4"/>
  <text x="604" y="964" font-size="26" fill="#455A64">Construcción (etapa 4)</text>
  <rect x="1030" y="940" width="30" height="30" rx="7" fill="#FFF3E0" stroke="#E65100" stroke-width="4"/>
  <text x="1074" y="964" font-size="26" fill="#455A64">Pruebas (etapas 5 y 6)</text>

  <text x="900" y="1018" font-size="26" font-style="italic" fill="#607D8B" text-anchor="middle">Si una prueba falla, se regresa a la etapa que corresponde.</text>
</svg>

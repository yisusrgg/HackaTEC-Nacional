; Proyecto PlatformIO con los dos firmwares (VS Code + extensión PlatformIO IDE):
;   pio run -e nodo_sensores -t upload    → ESP32 #1 (sensores)
;   pio run -e gateway -t upload          → ESP32 #2 (gateway)
;   pio device monitor                    → monitor serie a 115200 baudios
; El código común del protocolo está en lib/protocolo y se comparte entre ambos.

[platformio]
default_envs = nodo_sensores, gateway

[env]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
build_flags = -DCORE_DEBUG_LEVEL=1

[env:nodo_sensores]
build_src_filter = +<nodo_sensores/>
lib_deps =
    adafruit/DHT sensor library @ ^1.4.6
    adafruit/Adafruit Unified Sensor @ ^1.1.14
    pololu/VL53L0X @ ^1.3.1

[env:gateway]
build_src_filter = +<gateway/>
board_build.filesystem = littlefs
build_flags =
    ${env.build_flags}
    -DARDUINOJSON_USE_LONG_LONG=1
lib_deps =
    bblanchon/ArduinoJson @ ^7.2.0
